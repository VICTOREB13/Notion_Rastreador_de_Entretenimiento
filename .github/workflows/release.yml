name: Pipeline Unificado de Calidad, Contenedores y Release Oficial

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # JOB 1: Quality Gate & Automated Testing Pyramid
  # ============================================================================
  quality_gate:
    name: Quality Gate & Testing Pyramid
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./data/entertainment.db"

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Node.js (Next.js Standalone Build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias del Monorepo
        run: bun install --frozen-lockfile || bun install

      - name: Generar Prisma Client SQLite & Inicializar DB
        run: |
          mkdir -p packages/database/prisma/data data
          bun run db:generate
          bun run db:push

      - name: Análisis de Tipos Estricto (TypeScript Quality Gate)
        run: |
          echo "🔍 Verificando tipado estricto en packages/database, packages/server y apps/web..."
          bun run typecheck

      - name: Ejecutar Pirámide de Pruebas Automatizadas (Bun Test)
        run: bun test

      - name: Validar Paridad de Contratos SDD (Contract Drift Guard)
        run: bun run lint:contracts

      - name: Validar Estándares de Artefactos y Heurísticas
        run: bun run test:artifacts

      - name: Compilación de Producción Frontend (Next.js Standalone)
        run: |
          echo "📦 Compilando aplicación web Next.js 16..."
          bun run web:build

      - name: Generar Notas de Release Oficial
        shell: bash
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/RELEASE_NOTES.md
          # Notion Rastreador de Entretenimiento ${{ github.ref_name }}

          > **Release Oficial ${{ github.ref_name }}:** Plataforma integral de sincronización, agregación y visualización de entretenimiento (videojuegos y películas) con sincronización inteligente delta desde Notion, telemetría en tiempo real de Steam con período de gracia debounce, enriquecimiento semántico multimodal con Google Gemini 2.5 Flash y arquitectura Local-First SQLite WAL.

          ---

          ### 🛡️ Quality Gate & Verificación de Entrega

          | Métrica / Auditoría | Estado / Resultado | Descripción |
          |---|---|---|
          | **Quality Gate** | `STATUS: PASS` | Certificado por Systems-Auditor y pirámide de testing |
          | **Pruebas Automatizadas** | Unit & Integration Tests (100% PASS) | Ejecución en Bun Runner sin errores |
          | **Tipado Estricto** | TypeScript 5.8 (`tsc --noEmit`) | Cero errores en database, server y showcase-web |
          | **Contratos SDD** | `lint_contracts.ts: 100% Parity` | Paridad absoluta entre `api_spec.md` y endpoints HTTP |
          | **Artefactos Vivos** | Artefactos y Heurísticas Validadas | SSoT sin drift y presupuesto respetado |
          | **Compilación Frontend** | Next.js 16 App Router (Standalone) | Optimizado para producción en contenedor Docker |

          ---

          ### 📦 Componentes y Capacidades Principales

          | Componente | Rol en el Ecosistema | Tecnologías |
          |---|---|---|
          | **Daemon API** (`packages/server`) | Sincronización continua en segundo plano, workers de polling, API REST Hono RPC | Bun 1.4, Hono, Prisma 6, SQLite WAL |
          | **Showcase Web** (`apps/web`) | Dashboard interactivo de visualización, filtros, estadísticas y explorador | Next.js 16, React 19, Tailwind CSS, Lucide |
          | **Motor de Base de Datos** (`packages/database`) | Repositorios tipados, migraciones automáticas, cascade delete y agregaciones | SQLite, Prisma ORM, WAL Mode |
          | **Notion Sync Engine** | Delta Polling con marca de agua `last_edited_time`, Anti-Loop Guard y Zero-Overwrite | Notion REST API v2022-06-28 |
          | **Steam Live Tracker** | Detección de juego activo, elevación a "Jugando", 3-min debounce y streaks diarios | Steam Web API |
          | **Gemini AI Enricher** | Generación de "Vibe IA", recomendaciones cruzadas y guías de completitud | Google Gemini 2.5 Flash |

          ---

          ### 🚀 Despliegue Inmediato sin Compilar (Zero-Local-Compile)

          Para ejecutar la aplicación directamente utilizando las imágenes precompiladas de GitHub Container Registry:

          ```bash
          # 1. Descargar el archivo canónico docker-compose.yml y tu .env
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml
          cp .env.example .env # Configura tu NOTION_TOKEN, STEAM_KEY, etc.

          # 2. Descargar las imágenes pre-compiladas de GHCR y levantar el stack
          docker compose pull
          docker compose up -d
          ```

          Acceso:
          - **Showcase Web:** `http://localhost:20010` (o `http://<IP_DOKPLOY>:20010`)
          - **Daemon API / Health:** `http://localhost:20011/healthz` (o `http://<IP_DOKPLOY>:20011/healthz`)
          EOF

      - name: Preservar Notas de Release como Artefacto de Job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/RELEASE_NOTES.md
          retention-days: 1

  # ============================================================================
  # JOB 2: Build & Push Docker Images to GHCR (Encadenado tras Quality Gate)
  # ============================================================================
  docker_build:
    name: Build & Push Containers to GHCR
    needs: [quality_gate]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar QEMU (Soporte Multi-Arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Formatear Nombre de Repositorio a Minúsculas
        id: repo_owner
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Extraer Metadatos y Tags para Daemon API
        id: meta-daemon
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/notion-entertainment-daemon-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Compilar y Publicar Imagen Docker Daemon API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer Metadatos y Tags para Showcase Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/notion-entertainment-showcase-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Compilar y Publicar Imagen Docker Showcase Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3: Publicación de Release Oficial en GitHub (Encadenado tras Docker Build)
  # ============================================================================
  github_release:
    name: Publish Official GitHub Release
    needs: [docker_build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Descargar Notas de Release Previamente Generadas
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Crear Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Notion Rastreador de Entretenimiento ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: false
